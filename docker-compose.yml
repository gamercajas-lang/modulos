version: '3.8'

services:
  postgres:
    image: postgis/postgis:16-3.4
    container_name: agro_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DB_USERNAME:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-postgres}
      POSTGRES_DB: ${DB_NAME:-proyecto_agro}
    ports:
      - '5433:5432'
    volumes:
      - agro_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USERNAME:-postgres} -d ${DB_NAME:-proyecto_agro}"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - agro_network

  app:
    build: .
    container_name: agro_app
    restart: unless-stopped
    env_file:
      - .env
    environment:
      - DB_HOST=postgres
    ports:
      - '3000:3000'
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - agro_network

volumes:
  agro_pgdata:

networks:
  agro_network:
    driver: bridge
